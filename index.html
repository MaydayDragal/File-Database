<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="File Database — your files, LI documents, special tools and file utilities in one private, offline platform." />
  <title>File Database</title>
  <!-- Apply the saved theme before first paint (shared key with all apps). -->
  <script>(function(){try{var t=localStorage.getItem("fv-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon-64.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <header class="shellbar" role="banner">
    <div class="shellbar__brand">
      <img src="icons/favicon-64.png" alt="" width="26" height="26" />
      <span class="shellbar__name">File Database</span>
    </div>
    <nav class="shellbar__tabs" role="tablist" aria-label="Apps" id="tabs">
      <button class="shelltab" id="tab-vault" role="tab" data-app="vault" aria-selected="false" aria-controls="view-vault" tabindex="-1">
        <span class="shelltab__icon">📁</span><span class="shelltab__label">Files</span><span class="tab-count" data-count="vault"></span>
      </button>
      <button class="shelltab" id="tab-li" role="tab" data-app="li" aria-selected="false" aria-controls="view-li" tabindex="-1">
        <span class="shelltab__icon">🗄️</span><span class="shelltab__label">LI Documents</span><span class="tab-count" data-count="li"></span>
      </button>
      <button class="shelltab" id="tab-inventory" role="tab" data-app="inventory" aria-selected="false" aria-controls="view-inventory" tabindex="-1">
        <span class="shelltab__icon">🔧</span><span class="shelltab__label">Tool Inventory</span><span class="tab-count" data-count="inventory"></span>
      </button>
      <button class="shelltab" id="tab-toolbox" role="tab" data-app="toolbox" aria-selected="false" aria-controls="view-toolbox" tabindex="-1">
        <span class="shelltab__icon">🧰</span><span class="shelltab__label">Toolbox</span>
      </button>
    </nav>
    <div class="shellbar__actions">
      <div class="vehicle-chip" id="vehicle-chip" hidden>
        <button class="vehicle-chip__main" id="vehicle-chip-main" type="button"></button>
        <button class="vehicle-chip__x" id="vehicle-chip-unpin" type="button" title="Unpin this vehicle">✕</button>
      </div>
      <button class="btn-add" id="add-btn" title="Add files — they're filed automatically (LI documents to LI Documents, everything else to Files)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="btn-add__label">Add files</span>
      </button>
      <button class="icon-btn" id="backup-all-btn" title="Back up everything — saves all three databases (.fvault, .lidb, .tidb) in one go" aria-label="Back up all databases">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <button class="icon-btn" id="theme-btn" title="Theme: system → light → dark" aria-label="Toggle color theme">
        <svg class="theme-icon-dark" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        <svg class="theme-icon-light" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
      </button>
      <button class="btn-install" id="install-btn" hidden>⤓ Install</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <section class="app-panel" id="view-vault" role="tabpanel" aria-labelledby="tab-vault" hidden aria-label="File Vault">
      <iframe id="frame-vault" class="app-frame" title="File Vault" referrerpolicy="no-referrer"></iframe>
    </section>
    <section class="app-panel" id="view-li" role="tabpanel" aria-labelledby="tab-li" hidden aria-label="LI Document Database">
      <iframe id="frame-li" class="app-frame" title="LI Document Database" referrerpolicy="no-referrer"></iframe>
    </section>
    <section class="app-panel" id="view-inventory" role="tabpanel" aria-labelledby="tab-inventory" hidden aria-label="Tool Inventory">
      <iframe id="frame-inventory" class="app-frame" title="Tool Inventory" referrerpolicy="no-referrer"></iframe>
    </section>
    <section class="app-panel" id="view-toolbox" role="tabpanel" aria-labelledby="tab-toolbox" hidden aria-label="Toolbox">
      <iframe id="frame-toolbox" class="app-frame" title="Toolbox" referrerpolicy="no-referrer"></iframe>
    </section>
  </main>

  <!-- One front door for files: dropped/added here and filed automatically. -->
  <input type="file" id="shell-file-input" multiple hidden />
  <div id="shell-drop" class="shell-drop" hidden aria-hidden="true">
    <div class="shell-drop__card">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
      <div class="shell-drop__title">Drop files to add</div>
      <div class="shell-drop__hint">LI documents go to LI Documents · everything else to Files</div>
    </div>
  </div>

  <!-- Ctrl+K quick-open: paste any ID (VIN, LI number, tool number) and land
       on the record; anything else searches the app of your choice. -->
  <div id="quickopen" class="quickopen" hidden>
    <div class="quickopen__panel" role="dialog" aria-label="Quick open">
      <input id="qo-input" placeholder="Paste a VIN, LI number or tool number — or type to search…" autocomplete="off" spellcheck="false" />
      <div id="qo-results" class="quickopen__results"></div>
      <div class="quickopen__hint">Enter opens the first result · Esc closes · Alt+1–4 switches apps</div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="debug.js"></script>
  <script src="bridge.js"></script>
  <script src="shell.js"></script>
</body>
</html>
