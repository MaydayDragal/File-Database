<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Open a File Database backup (.fdb / .fvault / .lidb / .tidb) and download its contents as normal files." />
<title>Database File Viewer — File Database</title>
<script>(function(){try{var t=localStorage.getItem("fv-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<link rel="stylesheet" href="src/styles/tokens.css" />
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  #view-viewer { flex: 1; min-height: 0; display: flex; flex-direction: column; contain: layout paint; }
</style>
<!-- The same Extract feature the platform's tab mounts (src/features/extract),
     hosted on its own so a copy of this page next to your backups can always
     get the files back out. It needs only src/ — no database, no shell. -->
<script src="src/core/formats/container.js"></script>
<script src="src/core/formats/fdb.js"></script>
<script src="src/core/formats/zip.js"></script>
<script src="src/core/formats/fvault.js"></script>
<script src="src/core/formats/tidb.js"></script>
<script src="src/core/formats/lidb.js"></script>
</head>
<body>
<section id="view-viewer" aria-label="Database File Viewer"></section>
<script type="module">
  import { mount } from "./src/features/extract/index.js";
  // Standalone: no platform to route files to or navigate.
  const shell = { send() {}, toast(m) { console.log(m); }, setSub() {}, openPicker() {}, activate() {} };
  mount(document.getElementById("view-viewer"), shell);
</script>
</body>
</html>
